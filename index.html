<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Budaya HSS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🇮🇩 Jelajah Budaya HSS</h1>

    <!-- FORM PEMBUKA DATA PESERTA -->
    <div id="welcomeScreen" class="welcome-box">
        <p class="welcome-desc">Silakan isi data diri sebelum memulai kuis:</p>
        <form id="startForm" onsubmit="startQuiz(event)">
            <div class="input-group">
                <input type="text" id="userName" placeholder="Nama lengkap" required>
            </div>
            <div class="input-group">
                <input type="text" id="userAddress" placeholder="Desa" required>
            </div>
            <button type="submit" id="startBtn">Mulai Kuis 🚀</button>
        </form>
    </div>

    <!-- LAYAR LOGIN DATA PESERTA -->
<div id="welcomeScreen" class="welcome-box">
  <p class="welcome-desc">Silakan isi data diri untuk memulai:</p>
  <form id="startForm">
    <div class="input-group">
      <input type="text" id="userName" placeholder="Nama lengkap" required />
    </div>
    <div class="input-group">
      <input type="text" id="userAddress" placeholder="Desa / Alamat" required />
    </div>
    <button type="submit" id="startBtn">Lanjut 🚀</button>
  </form>
</div>

<!-- LAYAR PILIHAN KUIS (BARU) -->
<div id="topicScreen" class="topic-box" style="display: none;">
  <h2 class="topic-title">Pilih Petualanganmu!</h2>
  <p class="topic-desc">Pilih salah satu kuis di bawah ini untuk memulai:</p>
  
  <div class="topic-container">
    <button class="topic-card" onclick="selectTopic('nagara')">
      <span class="topic-badge">Kuis 1</span>
      <h3>Nagara</h3>
      <p>Kerajinan Gerabah</p>
    </button>

    <button class="topic-card" onclick="selectTopic('loksado')">
      <span class="topic-badge">Kuis 2</span>
      <h3>Loksado</h3>
      <p>Tradisi Pertanian</p>
    </button>
  </div>
</div>

    <!-- AREA KUIS -->
    <div id="quizScreen" style="display:none;">
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="info">
            <span>Soal <span id="questionNumber">1</span>/5</span>
            <span>⏱ <span id="timer">30</span> detik</span>
        </div>

        <div class="quiz-box">
            <h2 id="question"></h2>
            <div id="answers"></div>
            <button id="next" style="display:none;">Soal Berikutnya ➜</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>
</body>
</html>
