<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Budaya HSS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🇮🇩 Jelajah Budaya HSS</h1>

    <!-- LAYAR LOGIN DATA PESERTA -->
    <div id="welcomeScreen" class="welcome-box">
        <p class="welcome-desc">Silakan isi data diri untuk memulai:</p>
        <form id="startForm">
            <div class="input-group">
                <input type="text" id="userName" placeholder="Nama lengkap" required>
            </div>
            <div class="input-group">
                <input type="text" id="userAddress" placeholder="Desa / Alamat" required>
            </div>
            <button type="submit" id="startBtn">Lanjut 🚀</button>
        </form>
    </div>

            <!-- LAYAR PILIHAN KUIS -->
    <div id="topicScreen" class="topic-box" style="display: none;">
        <h2 class="topic-title">Pilih Petualanganmu!</h2>
        <p class="topic-desc">Pilih salah satu kuis di bawah ini untuk memulai:</p>
        
        <div class="topic-container" style="grid-template-columns: 1fr 1fr; gap: 12px;">
            <button class="topic-card nagara" onclick="selectTopic('gerabah')">
                <span class="topic-badge">Kuis 1</span>
                <h3>Gerabah</h3>
                <p>Kerajinan Tradisional</p>
            </button>

            <button class="topic-card loksado" onclick="selectTopic('aruh_ganal')">
                <span class="topic-badge">Kuis 2</span>
                <h3>Aruh Ganal</h3>
                <p>Tradisi Pertanian</p>
            </button>

            <button class="topic-card nagara" onclick="selectTopic('lamang')">
                <span class="topic-badge">Kuis 3</span>
                <h3>Lamang Kandangan</h3>
                <p>Kuliner Khas</p>
            </button>

            <button class="topic-card loksado" onclick="selectTopic('bubungan_tinggi')">
                <span class="topic-badge">Kuis 4</span>
                <h3>Rumah Bubungan Tinggi</h3>
                <p>Arsitektur Banjar</p>
            </button>

            <!-- LAYAR PILIHAN KUIS -->
<div id="topicScreen" class="topic-box" style="display: none;">
    <h2 class="topic-title">Pilih Petualanganmu!</h2>
    <p class="topic-desc">Pilih salah satu kuis di bawah ini untuk memulai:</p>
    
    <div class="topic-container">
        <button class="topic-card nagara" onclick="selectTopic('gerabah')">
            <span class="topic-badge">Kuis 1</span>
            <h3>Gerabah</h3>
            <p>Kerajinan Tradisional</p>
        </button>

        <button class="topic-card loksado" onclick="selectTopic('aruh_ganal')">
            <span class="topic-badge">Kuis 2</span>
            <h3>Aruh Ganal</h3>
            <p>Tradisi Pertanian</p>
        </button>

        <button class="topic-card lamang" onclick="selectTopic('lamang')">
            <span class="topic-badge">Kuis 3</span>
            <h3>Lamang Kandangan</h3>
            <p>Kuliner Khas</p>
        </button>

        <button class="topic-card bubungan_tinggi" onclick="selectTopic('bubungan_tinggi')">
            <span class="topic-badge">Kuis 4</span>
            <h3>Rumah Bubungan Tinggi</h3>
            <p>Arsitektur Banjar</p>
        </button>
    </div>
</div>
        </div>
    </div>

        <!-- AREA KUIS -->
    <div id="quizScreen" style="display:none;">
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="info">
            <span>Soal <span id="questionNumber">1</span>/5</span>
            <span>⏱ <span id="timer">30</span> detik</span>
        </div>

        <!-- TEMPAT ANIMASI/KADO (Di Luar Board) -->
        <div id="illustrationArea"></div>

        <div class="quiz-box">
            <h2 id="question"></h2>
            <div id="answers"></div>
            <button id="next" style="display:none;">Soal Berikutnya ➜</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>
</body>
</html>
